global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: pennywise-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3001"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        # Docker Desktop on Windows exposes its Linux VM to this exporter.
        labels:
          machine: docker-desktop-linux-vm
