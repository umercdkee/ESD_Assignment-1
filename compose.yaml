services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 3001
      CLIENT_ORIGIN: http://localhost:8080
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
